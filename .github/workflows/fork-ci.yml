name: Fork CI

on:
    push:
        branches:
            - custom
    pull_request:
        branches:
            - custom
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish to npm'
                required: false
                type: boolean
                default: false
            version:
                description: 'Version to publish (e.g., 2.0.0)'
                required: false
                type: string
            tag:
                description: 'npm dist-tag (e.g., beta, latest)'
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: [20, 22, 24]

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - run: pnpm install
            - run: pnpm check:all
            - run: pnpm build:all
            - run: pnpm test:all

    validate-publish:
        runs-on: ubuntu-latest
        needs: [build-and-test]

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - run: pnpm install

            - name: Dry-run publish
              run: ./scripts/publish-fork.sh --dry-run

            - name: Verify package.json restored
              run: |
                  NAME=$(node -p "require('./packages/server/package.json').name")
                  if [[ "$NAME" != "@modelcontextprotocol/server" ]]; then
                    echo "ERROR: package.json name was not restored (got '$NAME')"
                    exit 1
                  fi
                  echo "OK: package.json name is '$NAME'"

    publish:
        runs-on: ubuntu-latest
        if: github.event.inputs.publish == 'true'
        needs: [build-and-test, validate-publish]
        environment: release

        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v6

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml
                  registry-url: 'https://registry.npmjs.org'

            - run: pnpm install

            - name: Publish
              run: |
                  ARGS=""
                  if [[ -n "${{ github.event.inputs.version }}" ]]; then
                    ARGS="$ARGS --version ${{ github.event.inputs.version }}"
                  fi
                  if [[ -n "${{ github.event.inputs.tag }}" ]]; then
                    ARGS="$ARGS --tag ${{ github.event.inputs.tag }}"
                  fi
                  ./scripts/publish-fork.sh $ARGS
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
